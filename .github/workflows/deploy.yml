name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main  # আপনার প্রধান ব্রাঞ্চের নাম (main বা master)

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # ১. GitHub Repository থেকে কোড চেকআউট করা
      - name: Checkout Code
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # ৩. Dependencies ইন্সটল করা
      - name: Install Dependencies
        run: npm ci

      # ৪. প্রজেক্ট বিল্ড করা (Firebase Config সহ)
      - name: Build Project
        run: npm run build
        env:
          REACT_APP_FIREBASE_API_KEY: "AIzaSyDlBb0emNERqnHJ1IvmIZGFKEUEiEcRwyo"
          REACT_APP_FIREBASE_AUTH_DOMAIN: "mojo-33.firebaseapp.com"
          REACT_APP_FIREBASE_PROJECT_ID: "mojo-33"
          REACT_APP_FIREBASE_STORAGE_BUCKET: "mojo-33.firebasestorage.app"
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "548382431352"
          REACT_APP_FIREBASE_APP_ID: "1:548382431352:web:d879df682fbb9d4ec1758d"
          REACT_APP_FIREBASE_MEASUREMENT_ID: "G-C4E69C2TG5"

      # ৫. Firebase Hosting-এ ডেপ্লয় করা
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOJO_33 }}'
          projectId: mojo-33
          channelId: live
